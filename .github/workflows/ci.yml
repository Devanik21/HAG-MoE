name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # [UPDATE]: This enables the manual "Run workflow" button in GitHub Actions UI.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"] # [UPDATE]: Ensured all are strings to prevent parsing errors
        torch-version: ["2.0.1", "2.1.0"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5 # [UPDATE]: Upgraded to v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # [UPDATE]: v5 has built-in caching, making the separate cache step obsolete and faster!
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # [UPDATE]: Appended CPU index URL. This stops the massive ~2.5GB CUDA download, preventing runner crashes.
        pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
        
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        
    - name: Format check with black
      run: |
        black --check --diff src/ tests/
        
    - name: Import sorting check with isort
      run: |
        isort --check-only --diff src/ tests/
        
    - name: Type checking with mypy
      run: |
        mypy src/hag_moe --ignore-missing-imports
        
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=hag_moe --cov-report=xml --cov-report=term
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4 # [UPDATE]: Upgraded to v4 to prevent sudden v3 upload failures
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false # [UPDATE]: Changed to false. A third-party Codecov outage shouldn't fail your valid tests.
        token: ${{ secrets.CODECOV_TOKEN }} # Note: v4 requires a token. Add this in your GitHub Repo Secrets!

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    # [UPDATE]: Added workflow_dispatch so benchmarks run when triggered manually too.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # [UPDATE]: CPU version for the benchmark runner as well.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install -e .
        
    - name: Run benchmarks
      run: |
        python benchmarks/efficiency_benchmark.py --quick
